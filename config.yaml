# ============================================================
#  US Lead Agent - configuration
#  Everything here runs at ZERO cost. No API key, no credit
#  card, no billing account anywhere.
# ============================================================

# ---- DATA SOURCE -------------------------------------------
# "osm"      OpenStreetMap via Overpass API.
#            FREE. No key, no account, no card. Works the moment
#            you run it. Data is ODbL - yours to use with
#            attribution. Best for businesses with PREMISES.
#            START HERE.
#
# "overture" Overture Maps (Meta + Microsoft conflated, ~76M POIs).
#            FREE. No key, no account, no card. Much better
#            coverage, including service-area trades that OSM
#            misses. Licence CDLA-Permissive-2.0 - the output is
#            fully yours to store and even resell.
#            Needs DuckDB, which downloads a small extension on
#            first run. Switch to this once "osm" is working.
#
# "google"   NOT a free option in practice: Google requires a
#            billing account (a credit card) on the project even
#            to use its free tier. Left in only if that changes
#            for you. It is the only source with review counts.
source: "osm"

overpass:
  pause_seconds: 2.0     # be polite to donated public infrastructure
  radius_km: 25.0        # search radius around each city centre

overture_release: "2026-08-19.0"
google_api_key_env: "GOOGLE_MAPS_API_KEY"

# ---- WHERE TO HUNT -----------------------------------------
# Mid-size metros beat NYC/LA: less agency competition, and owners
# still answer their own phones.
#
# These are all EAST and CENTRAL time on purpose - their 9-11am is
# your 6:30-9:30pm IST, so you can call after your classes finish.
# They also avoid FL, OK, WA, MD, CO, MS, PA and TX, which have
# state telemarketing laws with no B2B exemption.
cities:
  - name: "Greenville, SC"
    lat: 34.8526
    lng: -82.3940
  - name: "Huntsville, AL"
    lat: 34.7304
    lng: -86.5861
  - name: "Chattanooga, TN"
    lat: 35.0456
    lng: -85.3097
  - name: "Fort Wayne, IN"
    lat: 41.0793
    lng: -85.1394
  - name: "Lexington, KY"
    lat: 38.0406
    lng: -84.5037
  - name: "Des Moines, IA"
    lat: 41.5868
    lng: -93.6250
  - name: "Omaha, NE"
    lat: 41.2565
    lng: -95.9345
  - name: "Grand Rapids, MI"
    lat: 42.9634
    lng: -85.6681

# ---- WHAT TO HUNT ------------------------------------------
# Chosen for OSM coverage: these businesses have PREMISES, so they
# are actually mapped. Service-area trades (roofers, plumbers) are
# thin in OSM - add them after you switch to source: "overture".
# See leadagent/osm_tags.py for the full list of mapped niches.
niches:
  - "dental clinic"
  - "driving school"
  - "auto repair shop"
  - "gym fitness studio"
  - "law firm"
  - "accounting firm"
  - "chiropractor"
  - "veterinary clinic"
  - "daycare preschool"
  - "med spa"
  - "hair salon"
  - "optician"
  - "insurance agency"
  - "real estate agency"
  - "funeral home"
  - "self storage"
  - "physiotherapist"
  - "travel agency"

# ---- HOW MUCH PER RUN --------------------------------------
# Overpass is donated infrastructure, so keep runs modest and the
# pause above in place. 20 queries x 40 results = plenty per day.
queries_per_run: 20
max_places_per_query: 40

# ---- WEBSITE AUDIT -----------------------------------------
website_audit:
  enabled: true
  timeout_seconds: 12
  # Treat these as "NO REAL WEBSITE" even though a URL exists.
  # This is the single biggest source of hidden leads.
  social_only_domains:
    - facebook.com
    - m.facebook.com
    - instagram.com
    - linktr.ee
    - yelp.com
    - nextdoor.com
    - tripadvisor.com
    - doordash.com
    - toasttab.com
    - booksy.com
    - vagaro.com
    - square.site
    - business.site          # Google's retired site builder
    - sites.google.com
    - godaddysites.com
    - wixsite.com            # unconfigured free Wix subdomain
    - weebly.com
    - blogspot.com
    - wordpress.com

# ---- SCORING ------------------------------------------------
# Higher opportunity_score = better lead for you.
scoring:
  # Website problems
  no_website_points: 55
  social_only_points: 45
  dead_site_points: 40
  under_construction_points: 35
  no_https_points: 12
  not_mobile_friendly_points: 14
  slow_load_points: 8            # > 4s
  very_slow_load_points: 6       # extra if > 8s
  stale_copyright_points: 8      # copyright year 2+ years old
  no_meta_description_points: 5
  no_title_points: 5

  # Credibility on FREE sources (no reviews exist)
  has_phone_points: 14
  no_phone_penalty: 25           # unreachable = not a lead
  has_email_points: 6
  multi_source_points: 8         # several datasets agreed it exists
  high_confidence_points: 8      # Overture confidence >= 0.8
  low_confidence_penalty: 12     # Overture confidence < 0.55

  # Credibility on Google only (used if you ever enable billing)
  min_reviews_to_qualify: 5
  reviews_bonus_tiers:
    - [200, 15]
    - [75, 12]
    - [25, 8]
    - [5, 4]
  thin_reviews_penalty: 18
  good_rating_bonus: 6

  # Can this category afford a $1,500 website?
  category_value_tiers:
    High-value profession:
      points: 12
      match: ["dentist", "dental", "lawyer", "law", "attorney", "doctor",
              "medical", "clinic", "orthodont", "veterinar", "surgeon",
              "accountant", "accounting", "financial", "insurance",
              "real estate", "estate_agent", "funeral", "med spa"]
    Solid local business:
      points: 6
      match: ["driving_school", "driving school", "car_repair", "auto repair",
              "hvac", "roofer", "roofing", "plumber", "electrician",
              "fitness", "gym", "kindergarten", "childcare", "daycare",
              "storage", "chiropract", "physiotherap", "optician",
              "travel_agency"]
    Thin margins:
      points: -8
      match: ["hairdresser", "nail", "cafe", "bakery", "florist", "tattoo",
              "laundry", "dry_cleaning"]

# Only report leads at or above this score.
min_score_to_report: 40

# ---- OUTREACH ----------------------------------------------
outreach:
  your_name: "Rohan Sharma"
  your_company: "WebiGeeks Digital"
  your_email: "rohan@webigeeksdigital.com"
