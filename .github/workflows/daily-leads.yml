# Runs the agent every morning at 8:00 AM IST on GitHub's free runners.
# No secrets to configure - the default data source needs no API key.
#
# Setup:
#   1. Push this folder to a GitHub repo (private is fine).
#   2. Actions tab -> enable workflows.
#   3. Done. Each run attaches the CSV + HTML report as a downloadable
#      artifact. Free tier covers this easily (~2 min/day of 2,000 min/mo).
name: Daily US lead run

on:
  schedule:
    - cron: "30 2 * * *"      # 02:30 UTC = 08:00 IST
  workflow_dispatch:           # lets you trigger a run by hand

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      # Keep the ledger between runs so you never see the same lead twice.
      - name: Restore lead ledger
        uses: actions/cache@v4
        with:
          path: data
          key: lead-ledger-${{ github.run_id }}
          restore-keys: lead-ledger-

      # Mockups accumulate here so links sent on earlier days keep working.
      - name: Restore mockup site
        uses: actions/cache@v4
        with:
          path: out/mockups
          key: mockups-${{ github.run_id }}
          restore-keys: mockups-

      - name: Hunt
        run: python3 run.py

      # Publishes out/mockups to demo.webigeeksdigital.com (Vercel project
      # "webigeeks-demo"). Skipped until the three secrets below exist.
      - name: Publish mockups
        if: ${{ env.VERCEL_TOKEN != '' }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx --yes vercel@latest deploy out/mockups --prod --yes --token="$VERCEL_TOKEN"

      - uses: actions/upload-artifact@v4
        with:
          name: leads-${{ github.run_number }}
          path: out/
          retention-days: 30
