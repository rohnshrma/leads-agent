# Finds leads for the WebiGeeks Digital CRM.
#
# Two ways it starts - and ONLY these two (no pull_request, no issue_comment, nothing an outsider can fire):
#   - By hand: the CRM's "Fetch new leads" button (or "Run workflow" on GitHub). Always runs.
#   - By the clock (the two crons below): runs ONLY if the CRM says automatic fetching is on
#     and that market's country is enabled. Both are off by default, so by default the clock
#     starts this workflow, sees "off" in the gate step and stops after a few seconds.
#
# THIS REPOSITORY IS PUBLIC. Anyone can read the code, the workflow runs and their logs. So:
#   - the log prints counts only (see leadagent/safelog.py); no names, phones, URLs, ids or keys;
#   - no artifact is uploaded and no cache holds lead data (only Python packages and Overture's open data);
#   - the CRM address, the ingest token and the Google key live in GitHub Secrets;
#   - the token has the minimum permission (contents: read).
#
# Setup: see docs/COST_SAFETY.md.
name: Lead run (US and Canada)

on:
  schedule:
    - cron: "30 2 * * *"      # 02:30 UTC = 08:00 IST  -> US leads (only if switched on in the CRM)
    - cron: "0 10 * * *"      # 10:00 UTC = 6:00 am Toronto -> Canadian leads (only if switched on)
  workflow_dispatch:           # lets you trigger a run by hand (or from the CRM button)
    inputs:
      crm_run_id:
        description: "Set by the CRM so it can match the results to its run"
        required: false
        default: ""
      market:
        description: "us or ca"
        required: false
        default: "ca"
      area:
        description: "Optional: search one area (city, suburb or postal code) instead of the national queue"
        required: false
        default: ""
      radius_km:
        description: "Optional: search radius around the area, 1-50"
        required: false
        default: ""
      niches:
        description: "Optional: comma-separated business types (default: all of them)"
        required: false
        default: ""
      min_score:
        description: "Optional: only report leads scoring at least this (0-100)"
        required: false
        default: ""

permissions:
  contents: read

# One run per market at a time: a second click or a stuck run cannot pile up and use up runner time.
concurrency:
  group: lead-run-${{ inputs.market || (github.event.schedule == '30 2 * * *' && 'us') || 'ca' }}
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 45          # the agent stops itself at 40 and posts what it has
    env:
      CRM_URL: ${{ secrets.CRM_URL || vars.CRM_URL }}
      CRM_INGEST_TOKEN: ${{ secrets.CRM_INGEST_TOKEN }}
      CRM_RUN_ID: ${{ inputs.crm_run_id }}
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      # The 10:00 UTC schedule is "ca"; a run started by hand says which market it wants (default Canada).
      MARKET: ${{ inputs.market || (github.event.schedule == '30 2 * * *' && 'us') || 'ca' }}
      EVENT_NAME: ${{ github.event_name }}
      # User-typed values are passed as environment variables and quoted in the shell, never pasted
      # into the command line, so a hostile area name cannot run commands.
      FETCH_AREA: ${{ inputs.area }}
      FETCH_RADIUS_KM: ${{ inputs.radius_km }}
      FETCH_NICHES: ${{ inputs.niches }}
      FETCH_MIN_SCORE: ${{ inputs.min_score }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Scheduled runs stop here unless the CRM has automatic fetching switched on.
      - name: Should this run?
        id: gate
        run: python3 scripts/check_auto_fetch.py

      - name: Install deps
        if: steps.gate.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      # Overture's open data, kept between runs so a repeat run is fast. This is the ONLY lead-related
      # cache: it holds public open data, never Google data and never lead rows.
      - name: Restore Overture open data
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: cache/overture
          key: overture-${{ hashFiles('config-ca.yaml', 'config.yaml') }}-${{ github.run_id }}
          restore-keys: |
            overture-${{ hashFiles('config-ca.yaml', 'config.yaml') }}-

      - name: Hunt
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail
          if [ "$MARKET" = "ca" ]; then CONFIG=config-ca.yaml; else CONFIG=config.yaml; fi
          args=(--config "$CONFIG" --time-limit-min 40)
          [ -n "$FETCH_AREA" ]      && args+=(--area "$FETCH_AREA")
          [ -n "$FETCH_RADIUS_KM" ] && args+=(--radius-km "$FETCH_RADIUS_KM")
          [ -n "$FETCH_NICHES" ]    && args+=(--niches "$FETCH_NICHES")
          [ -n "$FETCH_MIN_SCORE" ] && args+=(--min-score "$FETCH_MIN_SCORE")
          python3 run.py "${args[@]}"

      # Sends the new leads to the WebiGeeks Digital CRM. If the CRM cannot be reached the step FAILS
      # (a green run must never hide leads that were not delivered) and the next step tells the CRM.
      - name: Send results to the CRM
        if: steps.gate.outputs.proceed == 'true'
        run: python3 scripts/push_to_crm.py

      - name: Tell the CRM the run failed
        if: ${{ failure() && steps.gate.outputs.proceed == 'true' }}
        continue-on-error: true
        run: python3 scripts/push_to_crm.py --failed
