# ============================================================
#  India Lead Agent - configuration (run with --config config-in.yaml)
#  The owner's own market: the sales partner never sees these leads.
#  Same engine as config-ca.yaml; only the market, areas, business types and sender differ.
# ============================================================

source: "overture"

# Google Places (inside the shared call budget kept by the CRM backend), then Overture Maps.
# Google data is used in memory only; the CRM stores just the place_id (see docs/COMPLIANCE.md).
discovery: ["google", "overture"]

overpass:
  pause_seconds: 2.0
  # Indian cities are dense: a 6 km circle around each area keeps the Gurgaon areas below from
  # returning the same businesses. A fetch started from the CRM with an area can still set 1-50 km.
  radius_km: 6.0
  tile_km: 25.0
  mirrors:
    - https://overpass-api.de/api/interpreter

overture:
  max_places: 100
  cache_dir: cache/overture

overture_release: "latest"

# Each business type is matched on Overture's own category (exact). Taken from the 2026-11-18 release
# around Pune (counts there in brackets, as a guide to how much each type yields).
overture_categories:
  "dental clinic": [dental_clinic, general_dentistry, cosmetic_dentistry, pediatric_dentistry,
                    endodontics, periodontics, prosthodontics]                    # ~1,200
  "orthodontist": [orthodontics]                                                  # 41
  "skin and hair clinic": [dermatology, hair_replacement, hair_loss_center, laser_hair_removal,
                           medical_spa]                                           # ~310
  "coaching institute": [tutoring_service, test_preparation, computer_coaching, language_school,
                         private_tutor, civil_examinations_academy]               # ~1,600
  "interior designer": [interior_design]                                          # 1,130
  "physiotherapist": [physical_therapy, rehabilitation_center, sports_medicine]   # ~260
  "eye clinic": [vision_or_eye_care_clinic, optometry, ophthalmology]             # ~185
  "veterinary clinic": [veterinarian, animal_hospital]                            # ~70
  "preschool": [preschool, day_care_preschool, child_care_and_day_care]           # ~1,250
  "gym fitness studio": [gym, fitness_trainer]                                    # ~1,300
  "real estate agent": [real_estate_agent, real_estate_service]                   # ~4,400
google_api_key_env: "GOOGLE_MAPS_API_KEY"

# ---- WHERE TO HUNT -----------------------------------------
# Gurgaon (Gurugram) first, then the rest of Delhi NCR (the owner's own area).
# Areas marked priority: true get `priority_share` of every run that has no typed area; the rest of
# NCR shares what is left. Typing an area in the CRM ("Sohna Road", "Noida Sector 62") searches just that.
country: "IN"
# Drop an Overture result whose name plainly says another trade ("... Events", "... Travels", "... Caterers")
# even though Overture filed it under one of our categories (leadagent/categorize.py OTHER_TRADE).
drop_other_trades: true
priority_share: 0.7

